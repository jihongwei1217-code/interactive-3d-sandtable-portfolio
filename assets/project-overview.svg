<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Interactive 3D Sandtable Platform</title>
  <desc id="desc">A product workflow from field requirements to a browser-based 3D planner and print-oriented delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#0b2b45"/>
      <stop offset="1" stop-color="#123f5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d2ff"/>
      <stop offset="1" stop-color="#7cf7c4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <circle cx="1320" cy="110" r="230" fill="#35d2ff" opacity=".08"/>
  <circle cx="180" cy="650" r="280" fill="#7cf7c4" opacity=".06"/>
  <path d="M1050 84h350" stroke="url(#accent)" stroke-width="4" opacity=".85"/>
  <text x="110" y="150" fill="#86eaff" font-size="26" font-family="Arial, sans-serif" letter-spacing="6">PRODUCT CASE STUDY</text>
  <text x="110" y="230" fill="#ffffff" font-size="62" font-weight="700" font-family="Arial, sans-serif">Interactive 3D Sandtable</text>
  <text x="110" y="292" fill="#d6e7f2" font-size="28" font-family="Arial, sans-serif">From field requirements to a testable digital and physical workflow</text>

  <g transform="translate(110 390)">
    <g>
      <rect width="280" height="150" rx="22" fill="#ffffff" opacity=".08" stroke="#65dcff" stroke-opacity=".5"/>
      <circle cx="45" cy="44" r="16" fill="#35d2ff"/>
      <text x="78" y="53" fill="#ffffff" font-size="24" font-weight="700" font-family="Arial, sans-serif">Requirements</text>
      <text x="34" y="100" fill="#b8cfdd" font-size="18" font-family="Arial, sans-serif">Field observations</text>
      <text x="34" y="127" fill="#b8cfdd" font-size="18" font-family="Arial, sans-serif">Stakeholder feedback</text>
    </g>
    <path d="M300 75h70" stroke="#62e7df" stroke-width="4"/>
    <path d="M356 62l16 13-16 13" fill="none" stroke="#62e7df" stroke-width="4"/>
    <g transform="translate(390)">
      <rect width="280" height="150" rx="22" fill="#ffffff" opacity=".08" stroke="#65dcff" stroke-opacity=".5"/>
      <circle cx="45" cy="44" r="16" fill="#52e7dc"/>
      <text x="78" y="53" fill="#ffffff" font-size="24" font-weight="700" font-family="Arial, sans-serif">3D Planner</text>
      <text x="34" y="100" fill="#b8cfdd" font-size="18" font-family="Arial, sans-serif">Browser interaction</text>
      <text x="34" y="127" fill="#b8cfdd" font-size="18" font-family="Arial, sans-serif">Modular scene layout</text>
    </g>
    <path d="M690 75h70" stroke="#62e7df" stroke-width="4"/>
    <path d="M746 62l16 13-16 13" fill="none" stroke="#62e7df" stroke-width="4"/>
    <g transform="translate(780)">
      <rect width="280" height="150" rx="22" fill="#ffffff" opacity=".08" stroke="#65dcff" stroke-opacity=".5"/>
      <circle cx="45" cy="44" r="16" fill="#72f2c8"/>
      <text x="78" y="53" fill="#ffffff" font-size="24" font-weight="700" font-family="Arial, sans-serif">Delivery</text>
      <text x="34" y="100" fill="#b8cfdd" font-size="18" font-family="Arial, sans-serif">Print-oriented assets</text>
      <text x="34" y="127" fill="#b8cfdd" font-size="18" font-family="Arial, sans-serif">Docs and deployment</text>
    </g>
  </g>

  <rect x="110" y="620" width="720" height="3" fill="url(#accent)"/>
  <text x="110" y="666" fill="#a9c5d6" font-size="20" font-family="Arial, sans-serif">AI product thinking · rapid prototyping · robotics scenarios · cross-functional delivery</text>
  <ellipse cx="800" cy="360" rx="520" ry="18" fill="#35d2ff" opacity=".08" filter="url(#glow)"/>
</svg>
